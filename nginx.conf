server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Поддержка React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
